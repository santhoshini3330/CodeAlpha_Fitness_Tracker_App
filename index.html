<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏃 Fitness Tracker</h1>

        <p class="subtitle">
            Track your daily fitness activities
        </p>

        <!-- Dashboard -->

        <div class="dashboard">

            <div class="card">
                <h3>👣 Steps</h3>
                <p id="stepsDisplay">0</p>
                <span>steps</span>
            </div>

            <div class="card">
                <h3>🔥 Calories</h3>
                <p id="caloriesDisplay">0</p>
                <span>kcal</span>
            </div>

            <div class="card">
                <h3>⏱ Workout</h3>
                <p id="workoutDisplay">0</p>
                <span>minutes</span>
            </div>

        </div>


        <!-- Progress -->

        <div class="progress-section">

            <h2>Daily Step Goal</h2>

            <div class="progress-bar">

                <div id="progress" class="progress">
                </div>

            </div>

            <p id="progressText">
                0% completed
            </p>

        </div>


        <!-- Fitness Form -->

        <div class="form-section">

            <h2>➕ Add Fitness Data</h2>

            <label>Steps</label>

            <input
                type="number"
                id="steps"
                placeholder="Enter steps"
                min="0"
            >


            <label>Calories Burned</label>

            <input
                type="number"
                id="calories"
                placeholder="Enter calories"
                min="0"
            >


            <label>Workout Time (minutes)</label>

            <input
                type="number"
                id="workout"
                placeholder="Enter workout time"
                min="0"
            >


            <button onclick="addFitnessData()">
                Save Fitness Data
            </button>

        </div>


        <!-- Activity Summary -->

        <div class="summary">

            <h2>📊 Today's Summary</h2>

            <p id="summaryText">
                No fitness data added yet.
            </p>

        </div>


        <button class="reset" onclick="resetData()">
            Reset Today's Data
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
